<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="description" content="Windows 11 Fluent Notepad with nested pages, frame sliders, rich formatting, and 100% offline support." />
    <meta name="theme-color" content="#181818" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Notepad-XR" />
    <meta name="application-name" content="Notepad-XR" />
    <meta name="msapplication-TileColor" content="#181818" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Notepad-XR</title>
  </head>
  <body class="bg-neutral-800 antialiased overflow-hidden select-none">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(err => {
            console.log('SW registration failed:', err);
          });
        });
      }
    </script>
  </body>
</html>
